name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ruff · mypy · pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # У setup-uv нет плавающего мажорного тега, поэтому фиксируем коммит.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Зависимости (строго по uv.lock)
        run: uv sync --locked

      # Живые формулы XLSX проверяются пересчётом в LibreOffice, DOCX — его же
      # отрисовкой со встроенными шрифтами (tests/core/test_xlsx_formulas.py).
      # Достаточно одной ячейки матрицы; там пропуск этих тестов — ошибка.
      - name: LibreOffice для проверки формул XLSX
        if: matrix.python-version == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui libreoffice-writer-nogui
          echo "RENTAB_REQUIRE_LIBREOFFICE=1" >> "$GITHUB_ENV"

      - name: ruff check
        run: uv run ruff check --output-format=github

      - name: ruff format
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest
