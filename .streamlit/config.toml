[client]
# Кнопка «Deploy» и меню разработчика не нужны посетителю демо.
toolbarMode = "viewer"

[server]
headless = true
# Загружаемый файл профиля — десятки килобайт; ядро отклоняет файлы больше
# 2 МБ (rentab_core.io.MAX_PROFILE_BYTES), Streamlit не принимает больше 2 МБ.
maxUploadSize = 2
# Шрифты темы из app/static: только чтение, пользовательских данных там нет.
enableStaticServing = true

[browser]
# Приватность (L-10): браузер не отправляет Streamlit анонимную статистику
# использования приложения.
gatherUsageStats = false
