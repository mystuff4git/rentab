# Настройки Streamlit для app/. Streamlit читает их из текущей директории
# запуска, поэтому файл лежит в корне репозитория:
#   uv run streamlit run app/Home.py
# В отличие от v0.3, enableCORS = false не задаётся: Streamlit 1.66 считает
# это небезопасным и предупреждает при запуске, а приложению это не нужно.
[theme]
base = "light"

[server]
headless = true
# Загружаемый файл профиля — десятки килобайт; ядро отклоняет файлы больше
# 2 МБ (rentab_core.io.MAX_PROFILE_BYTES), Streamlit не принимает больше 2 МБ.
maxUploadSize = 2

[browser]
# Приватность (L-10): браузер не отправляет Streamlit анонимную статистику
# использования приложения.
gatherUsageStats = false
