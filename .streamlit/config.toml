# Настройки Streamlit для app/. Streamlit читает их из текущей директории
# запуска, поэтому файл лежит в корне репозитория:
#   uv run streamlit run app/Home.py
# В отличие от v0.3, enableCORS = false не задаётся: Streamlit 1.66 считает
# это небезопасным и предупреждает при запуске, а приложению это не нужно.

# Тема «Бордо и пергамент» (фаза 6, ADR 0008): светлая и тёмная, по умолчанию —
# как в системе; переключается в меню ⋮ (System, Light, Dark). Контраст
# текста — не ниже 4,5:1, цветов графиков — не ниже 3:1 к фону (палитра —
# app/ui/charts.py).
# Шрифты ParaType (OFL) лежат в app/static/fonts: браузер не обращается к
# сторонним серверам шрифтов.
[theme]
font = "PT Sans, 'Segoe UI', Roboto, Arial, sans-serif"
headingFont = "PT Serif, Georgia, 'Times New Roman', serif"
codeFont = "PT Mono, 'Courier New', monospace"
headingFontWeights = [700, 700, 700, 700, 700, 700]
headingFontSizes = ["2.4rem", "1.6rem", "1.3rem", "1.1rem", "1rem", "0.9rem"]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
# Цвета серий графиков — те же, что в app/ui/charts.py.
chartCategoricalColors = ["#3767A4", "#A280C8", "#B8892D", "#A94753", "#46A16B"]

