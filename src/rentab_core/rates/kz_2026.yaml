# Реестр ставок РК на 2026 год, которые использует ядро Rentab.
#
# С 1 января 2026 года действует новый Налоговый кодекс РК (Кодекс от 18 июля
# 2025 года № 214-VIII). Фаза 3: значения сверены с первоисточниками по
# выдержкам их текста и разъяснениям КГД, ЕНПФ, ГФСС и ФСМС (полные тексты из
# окружения разработки были недоступны). needs_review: true — источник найден
# частично или расходится. Сводка — docs/rates_verification.md.
#
# value в rates — доля: 0.20 = 20%. Суммы в amounts заданы в МРП или МЗП и
# переводятся в тенге по показателю года (indices).
country: KZ
